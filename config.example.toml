# subseggo config: process a multi-day event given as a list of day videos.
#
# Run:  uv run --script pipeline.py --config event.toml [options]
#
# Each [[days]] entry is ONE day of the event (the video is already cut to that
# day). Days are never guessed: the day comes from the entry itself (title=),
# and every video is processed in its own workdir under workdir_root.
#
# Any pipeline option can be set globally at the top level of this file and/or
# per [[days]] entry (per-day keys win over global ones). Explicit CLI flags
# win over both. Keys use the CLI flag names with underscores, e.g.:
#   height, language, transcribe_provider, segment_provider, transcribe_model,
#   segment_model, effort, chunk_minutes,
#   chunk_silence_min_seconds, chunk_overlap_seconds,
#   silence_dbfs, silence_min_seconds, transcript_coverage_check,
#   align_check, align_samples, align_search_seconds, align_repair,
#   subs ("embed"|"burn"|"sidecar"), reencode, no_combined, pi_bin,
#   skip_download, skip_transcribe, skip_segment, skip_edit, force_edit,
#   no_snap_keyframes, sandbox ("auto"|"bwrap"|"none"), max_retries,
#   retry_base_seconds, retry_max_seconds, mock_transcript, mock_segments,
#   workdir_root

workdir_root = "work"   # per-day workdirs are created under this dir
height = 1080
language = "en"
subs = "embed"

# --- transcription chunking -------------------------------------------------
# Chunks are cut at silences, never through them: a provider compresses a long
# silence (a real 347.7 s one came back as 77.9 s) and its timestamps then drift
# by minutes. Audio below silence_dbfs counts as silence; a chunk ends at the next
# silence of at least chunk_silence_min_seconds and the silence is not uploaded.
# A speech region still longer than chunk_minutes is split into the fewest equal
# pieces that fit, overlapping by chunk_overlap_seconds.
chunk_minutes = 55
# chunk_silence_min_seconds = 30.0
# chunk_overlap_seconds = 60.0
# silence_dbfs = -60.0            # loudness below which audio is silence
# silence_min_seconds = 0.5       # shortest silence the analysis reports
# transcript_coverage_check = true   # compare each chunk's cues with its own audio

# --- post-edit alignment ----------------------------------------------------
# Measure each output against raw.mp4 at align_samples points across
# +/-align_search_seconds, then shift the .srt by the interpolated lag.
align_check = true
# align_samples = 8
# align_search_seconds = 3.0
# align_repair = true             # false: measure but leave the .srt untouched

# Select the providers independently. Both default to "mistral".
# transcribe_provider = "mistral"
# segment_provider = "openai"

# Optional model and effort settings for the selected provider:
# [providers.mistral.transcribe]
# model = "voxtral-small-transcribe-3"
# [providers.mistral.segment]
# model = "mistral/mistral-large-latest"
# effort = "medium"
# [providers.openai.transcribe]
# model = "whisper-1"                   # timestamped API shuts down 2027-02-26
# [providers.openai.segment]
# model = "gpt-6.1-terra"
# effort = "medium"

[[days]]
url = "https://www.youtube.com/watch?v=DAY1_VIDEO_ID"   # YouTube URL or 11-char ID
title = "Day 1"                                          # names the day (prompt context + chapters)
# workdir = "work/day-1"                                 # optional; default work/<slug(title)> or work/<video_id>

[[days]]
path = "/data/event/day2.mp4"                           # local file instead of a YouTube URL
title = "Day 2"

[[days]]
url = "https://www.youtube.com/watch?v=DAY3_VIDEO_ID"
title = "Day 3"
subs = "sidecar"                                         # per-day override of a global option
